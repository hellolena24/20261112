<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/計算機.css">
</head>

<body>
    <div class="bear">
        <!-- 熊熊的耳朵 -->
        <div class="ear ear-left"></div>
        <div class="ear ear-right"></div>
        <!-- 熊熊的頭 -->
        <div class="head">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="nose"></div>
            <!-- 計算機 -->
        </div>
        <div class="calculator">
            <!-- 螢幕 -->
            <div class="screen">0</div>
            <!-- 按鈕區 -->
            <div class="row">
                <button class="function">▶</button>
                <button class="function">AC</button>
                <button class="function">%</button>
                <button class="function">/</button>
            </div>

            <div class="row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="function">x</button>
            </div>
            <div class="row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="function">-</button>
            </div>
            <div class="bottom">
                <div class="bottom-left">
                <div class="row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                </div>
                <div class="row">
                    <button>0</button>
                    <button>.</button>
                    <button class="equal">=</button>
                </div>
            </div>
                <button class="function plus">+</button>
            </div>
        </div>

    </div>

</body>

</html>
